name: CI

# Single-platform check for pull requests and pushes. Full multi-platform
# bundles are only built by release.yml on version tags, to keep Actions
# minutes low on a private repo.
on:
  pull_request:
  push:
    branches:
      - main
      - 'upstream-sync/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # The debug build, clippy and the test build together fill the runner's
      # disk, and the cargo cache save at the end of the job then fails with
      # "No space left on device". These preinstalled toolchains are not used
      # here and free well over 20 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Lint frontend
        run: npm run lint

      - name: Frontend tests
        run: npm test

      # tauri::generate_context! requires the built frontend (frontendDist).
      - name: Build frontend
        run: npm run build

      - name: Backend check
        working-directory: src-tauri
        run: cargo check --locked

      # Both gates are advisory (continue-on-error) until the findings they
      # report on the current tree are cleaned up; see the TODO on each step.
      # The format check covers the fork's own module only: upstream's files
      # are not rustfmt-clean either, and reformatting them would conflict
      # with every upstream merge.
      # TODO: 155 rustfmt diffs in src/local_db on the tree this was added to;
      # drop continue-on-error once one cargo fmt run over the module lands.
      - name: Backend format check (advisory)
        working-directory: src-tauri
        continue-on-error: true
        run: rustfmt --check --edition 2021 src/local_db/mod.rs

      # TODO: 34 clippy findings on the tree this was added to (31 in upstream
      # files, 3 in src/local_db), with -D warnings stopping at the first
      # target, so the test target is not counted yet; drop continue-on-error
      # once they are fixed or allowed.
      - name: Backend lint (advisory)
        working-directory: src-tauri
        continue-on-error: true
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test --locked
